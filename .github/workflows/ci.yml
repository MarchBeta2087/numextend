# GitHub Actions CI：三/多平台构建 + 全量测试 + 打包消费 + Clang/MSVC + ASan/UBSan
name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  # 优化构建：覆盖 -O2 下的严格别名/UB/内联路径
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Python deps
        run: pip install mpmath
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo
        run: ./build/demo
      - name: Install & downstream
        run: |
          cmake --install build --prefix "${{ github.workspace }}/_install"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-downstream
          ./build-downstream/downstream
      - name: API audit
        run: sh scripts/api_audit.sh build

  # 共享库构建：验证 BUILD_SHARED_LIBS + SOVERSION + 安装消费
  linux-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (shared)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install & downstream (shared)
        run: |
          cmake --install build --prefix "${{ github.workspace }}/_install"
          ls -l "${{ github.workspace }}/_install/lib"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-downstream
          LD_LIBRARY_PATH="${{ github.workspace }}/_install/lib" \
            ./build-downstream/downstream

  # 非优化构建：保留断言与 -O0 行为，与 linux/windows 的优化构建互补
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo
        run: ./build/demo
      - name: Install & downstream
        run: |
          cmake --install build --prefix "${{ github.workspace }}/_install"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-downstream
          ./build-downstream/downstream

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo
        run: ./build/demo.exe
      - name: Install & downstream
        run: |
          cmake --install build --prefix "$PWD/_install"
          cmake -S examples/downstream -B build-downstream -G Ninja \
                -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build build-downstream
          ./build-downstream/downstream.exe

  # Clang 编译器覆盖（Linux）
  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (clang)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # C++ 互操作（TODO §A1/A2）：公开头文件 extern "C" + 链接 C 编译的库；
  # 矩阵覆盖 C++11 / 17 / 23。
  linux-cpp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx_std: [11, 17, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Build & test (C++${{ matrix.cxx_std }})
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }}
          cmake --build build --target test_cpp_consumer --parallel
          ctest --test-dir build -R cpp_consumer --output-on-failure

  # C 标准矩阵（TODO §A3）：C99 由 linux job 覆盖，这里验证 C11/17/23。
  linux-c-std:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        c_std: [11, 17, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Build & test (C${{ matrix.c_std }})
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNEX_C_STANDARD=${{ matrix.c_std }}
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  # 子集构建（TODO §B2）：文件级裁剪 + 依赖闭包
  linux-subset:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modules: ["bigint_bin,bigfrac", "bigfloat", "fft,ntt"]
    steps:
      - uses: actions/checkout@v4
      - name: Build subset (${{ matrix.modules }})
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNEX_MODULES="${{ matrix.modules }}"
          cmake --build build --parallel
          if [ -x build/subset_smoke ]; then ./build/subset_smoke; fi

  # 单文件组合（TODO §B4）：amalgam 构建 + 全量测试
  linux-amalgam:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modules: ["all", "bigfloat"]
    steps:
      - uses: actions/checkout@v4
      - name: Build amalgam (${{ matrix.modules }})
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNEX_AMALGAM=ON -DNEX_MODULES="${{ matrix.modules }}"
          cmake --build build --parallel
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --output-on-failure
          fi
          if [ -x build/subset_smoke ]; then ./build/subset_smoke; fi

  # 单文件组合示例（无 CMake，直接 cc）——「单文件分发」场景
  linux-amalgam-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run amalgam example
        run: |
          python3 scripts/amalgamate.py --out dist
          cc -O2 -std=c99 -Wall -Wextra -Wpedantic -Idist \
             examples/amalgam/main.c dist/nex_amalgam.c -lm -o dist/amalgam_demo
          ./dist/amalgam_demo

  # 子集安装 + 下游消费（examples/downstream 仅用 bigint_bin）
  linux-subset-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install subset & build downstream
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNEX_MODULES="bigint_bin,bigfrac"
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/_install-subset"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="$PWD/_install-subset"
          cmake --build build-downstream
          ./build-downstream/downstream

  # 32 位平台验证（TODO §G 第 6 项）：-m32 构建 + 全量 CTest
  linux-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Build & test (32-bit)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-m32 -msse2 -mfpmath=sse" \
                -DCMAKE_CXX_FLAGS="-m32 -msse2 -mfpmath=sse" \
                -DCMAKE_EXE_LINKER_FLAGS=-m32
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  # 大端平台验证（TODO §G 第 6 项）：s390x 交叉 + QEMU，跑 C 单元测试
  linux-bigendian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu qemu-user
      - name: Build & test (s390x big-endian)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=s390x \
                -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++ \
                -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-s390x;-L;/usr/s390x-linux-gnu"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  # GCC + ASan/UBSan
  linux-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (GCC ASan+UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug                 -DNEX_SANITIZE=address,undefined -DNEX_DEBUG_INVARIANTS=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 线程池 / 并行 NTT + TSan（TODO §F F3）：与 ASan job 分开（TSan 不能与 ASan 同编）
  linux-thread-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (TSan, thread pool)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DNEX_ENABLE_THREAD=ON -DNEX_SANITIZE=thread
          cmake --build build --parallel
      # 高熵 ASLR 会触发 TSan "unexpected memory mapping"；setarch -R 关闭即可
      - name: Test (thread pool / parallel NTT)
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure -R parallel_ntt

  # contrib 大数实验（分块 NTT / SSA / out-of-core）：默认 OFF，单独构建并跑自检
  linux-bignum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (contrib big-number experiments)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DNEX_ENABLE_BIGNUM=ON -DNEX_ENABLE_SSA=ON
          cmake --build build --parallel
      - name: Test (block / ssa / ooc)
        run: ctest --test-dir build --output-on-failure -R 'block_ntt_selfcheck|nex_ssa_test|nex_ooc_test'

  # P2-D：属性/差分模糊测试（libFuzzer + ASan/UBSan，固定预算）
  linux-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzz target (clang, ASan/UBSan)
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNEX_ENABLE_FUZZ=ON \
                -DNEX_DEBUG_INVARIANTS=ON
          cmake --build build-fuzz --target fuzz_nex --parallel
      - name: Fuzz (120 s budget)
        run: |
          mkdir -p build-fuzz/corpus
          cp -r tests/fuzz/corpus/. build-fuzz/corpus/
          ./build-fuzz/tests/fuzz_nex build-fuzz/corpus -max_total_time=120 \
                -rss_limit_mb=2048 -print_final_stats=1

  # P2-C：limb 层有界验证（CBMC）；只验证 nex/bigint/bin 的信任基
  linux-cbmc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC
        run: sudo apt-get update && sudo apt-get install -y cbmc
      - name: Verify limb arithmetic (CBMC)
        env:
          NEX_CBMC_REQUIRE: "1"
        run: sh scripts/verify-cbmc.sh

  # OpenCL 实验：PoCL CPU 设备只做正确性（不跑性能断言）
  linux-opencl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL (PoCL CPU runtime)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd
      - name: Build (contrib OpenCL)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEX_ENABLE_OPENCL=ON
          cmake --build build --parallel
      - name: Test (PoCL CPU)
        env:
          NEX_OPENCL_REQUIRE: "1"
        run: ctest --test-dir build --output-on-failure -R nex_opencl

  # 覆盖率门槛（Linux）：库行覆盖率 ≥ 80%
  linux-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Build (coverage)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="--coverage -fprofile-abs-path" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Coverage gate (line ≥ 80%)
        run: gcovr --root . --filter 'nex/' --print-summary --fail-under-line 80

  # AppleClang + ASan/UBSan
  macos-sanitizer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan+UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEX_SANITIZE=address,undefined
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MSVC 覆盖（与 MinGW 的 windows job 互补）
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MSVC ASan（MSVC 无 UBSan）
  windows-asan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build (MSVC ASan)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNEX_SANITIZE=address
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 文档：构建参考手册并校验生成的 API 页面与头文件同步
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build manual
        run: sh scripts/docs.sh
      - name: Verify generated docs are up to date
        run: git diff --exit-code -- docs/manual docs/modules.md
