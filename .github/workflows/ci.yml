# GitHub Actions CI：三/多平台构建 + 全量测试 + 打包消费 + Clang/MSVC + ASan/UBSan
name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  # 优化构建：覆盖 -O2 下的严格别名/UB/内联路径
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo
        run: ./build/demo
      - name: Install & downstream
        run: |
          cmake --install build --prefix "${{ github.workspace }}/_install"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-downstream
          ./build-downstream/downstream

  # 共享库构建：验证 BUILD_SHARED_LIBS + SOVERSION + 安装消费
  linux-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (shared)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install & downstream (shared)
        run: |
          cmake --install build --prefix "${{ github.workspace }}/_install"
          ls -l "${{ github.workspace }}/_install/lib"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-downstream
          LD_LIBRARY_PATH="${{ github.workspace }}/_install/lib" \
            ./build-downstream/downstream

  # 非优化构建：保留断言与 -O0 行为，与 linux/windows 的优化构建互补
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo
        run: ./build/demo
      - name: Install & downstream
        run: |
          cmake --install build --prefix "${{ github.workspace }}/_install"
          cmake -S examples/downstream -B build-downstream \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-downstream
          ./build-downstream/downstream

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demo
        run: ./build/demo.exe
      - name: Install & downstream
        run: |
          cmake --install build --prefix "$PWD/_install"
          cmake -S examples/downstream -B build-downstream -G Ninja \
                -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build build-downstream
          ./build-downstream/downstream.exe

  # Clang 编译器覆盖（Linux）
  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (clang)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # GCC + ASan/UBSan
  linux-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (GCC ASan+UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEX_SANITIZE=address,undefined
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # AppleClang + ASan/UBSan
  macos-sanitizer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (ASan+UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEX_SANITIZE=address,undefined
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MSVC 覆盖（与 MinGW 的 windows job 互补）
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # MSVC ASan（MSVC 无 UBSan）
  windows-asan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build (MSVC ASan)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNEX_SANITIZE=address
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
