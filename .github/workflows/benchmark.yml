# 性能基准：仅手动或定时触发（不进 PR 门禁——CI runner 噪声大）。
# 产物为 Markdown 报告 artifact；绝对数字仅作趋势参考。
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      budget:
        description: '时间预算（秒）'
        required: false
        default: '600'
  schedule:
    - cron: '0 4 * * *'   # 每日 04:00 UTC

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark (deep, reduced)
        run: sh scripts/bench.sh docs/performance-ci.md "${{ github.event.inputs.budget || '600' }}"
      - name: Run math benchmark (CI preset)
        run: |
          cmake --build build-bench --target bench_math --parallel
          ./build-bench/bench_math --preset ci --budget 300             --json bench-math-ci.json | tee bench-math-ci.txt
      - name: Compare math benchmark to baseline (advisory)
        run: |
          python3 scripts/bench-math-compare.py \
            --current bench-math-ci.json \
            --baseline bench/baseline/bench-math-ci.json \
            --out bench-math-compare.md
          cat bench-math-compare.md >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f bench/baseline/bench-math-ci.json ]; then
            echo "::notice::No committed baseline; download bench-math-ci.json from this run and commit it to bench/baseline/."
          fi
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            docs/performance-ci.md
            bench-math-ci.txt
            bench-math-ci.json
            bench-math-compare.md
