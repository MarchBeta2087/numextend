# 性能基准：仅手动或定时触发（不进 PR 门禁——CI runner 噪声大）。
# 产物为 Markdown 报告 artifact；绝对数字仅作趋势参考。
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      budget:
        description: '时间预算（秒）'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * *'   # 每日 04:00 UTC

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Run benchmarks (unified runner, ci profile)
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.budget }}" ]; then
            EXTRA="--max-time ${{ github.event.inputs.budget }}"
          fi
          python3 scripts/bench.py --all --profile ci $EXTRA \
                --json bench-ci.json --markdown-out bench-ci.md
      - name: Compare math benchmark to baseline (advisory)
        run: |
          python3 scripts/bench-math-compare.py \
            --current build/bench/core.math.ci.json \
            --baseline bench/baseline/bench-math-ci.json \
            --out bench-math-compare.md
          cat bench-math-compare.md >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f bench/baseline/bench-math-ci.json ]; then
            echo "::notice::No committed baseline; download core.math.ci.json from this run and commit it to bench/baseline/bench-math-ci.json."
          fi
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            bench-ci.json
            bench-ci.md
            build/bench/*.log
            build/bench/core.math.ci.json
            bench-math-compare.md
